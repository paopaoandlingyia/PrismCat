# PrismCat 配置文件
# 复制此文件为 config.yaml 并根据需要修改

server:
  # 监听地址。默认为空（监听所有网卡）。
  # 若仅限本机访问，可设为 127.0.0.1
  addr: ""
  # 监听端口
  port: 8080

  # 主机名（用于判断是否为 UI 请求）
  ui_hosts:
    - "localhost"
    - "127.0.0.1"
  # 控制台密码。留空时，首次访问 UI 会要求设置密码。
  # Docker/服务器部署也可使用 PRISMCAT_UI_PASSWORD 覆盖。
  ui_password: ""

  # 代理域名后缀（用于 Host 路由）
  # 例如: openai.localhost -> upstream=openai
  # 上云时可改为: prismcat.example.com，然后用 openai.prismcat.example.com 访问
  proxy_domains:
    - "localhost"

  # 可选：开启路径路由兼容模式
  # 开启后也可通过 /_proxy/openai/v1 这样的地址转发，无需子域名解析
  enable_path_routing: false
  path_routing_prefix: "/_proxy"

  # 优雅关闭超时（秒）
  shutdown_timeout_seconds: 10

  # CORS（主要用于本地开发/调试 UI）
  # 生产/上云建议配置为明确的来源列表
  cors_allow_origins:
    - "*"
  cors_allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  cors_allow_headers:
    - "Content-Type"
    - "Authorization"

# 上游路由配置
# 格式: 子域名 -> 上游地址
upstreams:
  openai:
    # 匹配 openai.localhost:8080
    target: "https://api.openai.com"
    # 可选：超时设置（秒）
    timeout: 120
    # 可选：出站代理策略。env=读取 HTTP_PROXY/HTTPS_PROXY，direct=强制直连，也可填写代理 URL。
    outbound_proxy: "env"

  gemini:
    # 匹配 gemini.localhost:8080
    target: "https://generativelanguage.googleapis.com"
    timeout: 120
    # 例如通过 Clash 本地 HTTP 代理访问 Gemini:
    # outbound_proxy: "http://127.0.0.1:7890"

# 日志配置
logging:
  # 最大请求体记录大小（字节）
  max_request_body: 1048576   # 1MB
  # 最大响应体记录大小（字节）
  max_response_body: 10485760 # 10MB

  # 是否在“请求体已完整发送到上游，但上游还未返回响应头”时就提前保存一次数据库快照。
  # 注意：日志详情实时查看不依赖此项；关闭时，打开中的 UI 仍可通过 live 通道看到进行中请求的 Request Body。
  # 开启后：进程重启/页面刷新/断开 live 后，仍可从数据库读取这份中间态 Request Body；
  # 代价：每个请求会额外多一次数据库写入（高并发下可能降低吞吐/更易丢日志）。
  early_request_body_snapshot: false

  # 大 body 自动分离到 blob 存储（内容寻址 + 去重）
  # request_logs 表只保留预览片段 + hash/ref，详情可按需加载完整内容
  detach_body_over_bytes: 262144 # 256KB；设为 0 可禁用；留空则默认 256KB
  body_preview_bytes: 4096       # 4KB；设为 0 可关闭预览

  # 需要脱敏的请求头
  sensitive_headers:
    - "Authorization"
    - "x-api-key"
    - "api-key"

# 存储配置
storage:
  # SQLite 数据库路径
  database: "./data/prismcat.db"
  # 日志保留天数；0 = 永久保留
  retention_days: 30

  # blob 存储（用于分离大 body）
  blob_store: "fs"
  blob_dir: "./data/blobs"
  
  # async_buffer controls the capacity of the async log queue.
  # Larger values allow handling higher burst throughput but use more memory.
  # Default: 4096
  # async_buffer: 4096

# 请求参数覆盖（默认关闭）
# 开启后 PrismCat 会在命中规则时修改最终发往上游的 JSON 请求体。
# 这会让对应请求从透明流式转发变为先缓冲、再转发；请只对明确需要的路由启用。
request_overrides:
  enabled: false
  max_body_bytes: 1048576
  upstreams: {}
  rules: []
