# PrismCat 配置文件
# 复制此文件为 config.yaml 并根据需要修改

server:
  # 监听地址。默认为空（监听所有网卡）。
  # 若仅限本机访问，可设为 127.0.0.1
  addr: ""
  # 监听端口
  port: 8711

  # 主机名（用于判断是否为 UI 请求）
  ui_hosts:
    - "localhost"
    - "127.0.0.1"
  # 控制台密码。留空时，首次访问 UI 会要求设置密码。
  # Docker/服务器部署也可使用 PRISMCAT_UI_PASSWORD 覆盖。
  ui_password: ""

  # 代理域名后缀（用于 Host 路由）
  # 例如: openai.localhost -> upstream=openai
  # 上云时可改为: prismcat.example.com，然后用 openai.prismcat.example.com 访问
  proxy_domains:
    - "localhost"

  # 可选：开启路径路由兼容模式
  # 开启后也可通过 /_proxy/openai/v1 这样的地址转发，无需子域名解析
  enable_path_routing: false
  path_routing_prefix: "/_proxy"

  # 优雅关闭超时（秒）
  shutdown_timeout_seconds: 10

  # CORS（主要用于本地开发/调试 UI）
  # 生产/上云建议配置为明确的来源列表
  cors_allow_origins:
    - "*"
  cors_allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  cors_allow_headers:
    - "Content-Type"
    - "Authorization"

# 上游路由配置
# 格式: 子域名 -> 单个上游地址，或一组可切换的目标预设
upstreams:
  openai:
    # 匹配 openai.localhost:8711
    target: "https://api.openai.com"
    # 可选：整个上游请求和响应过程的总超时（秒），包含等待响应头、首个响应体字节和后续响应体。
    timeout: 120
    # 高级：等待上游 HTTP 状态码和响应头的阶段超时（秒）。0 = 禁用。
    # 设为正数时通常应小于 timeout；实际等待仍不会超过总超时。
    response_header_timeout: 60
    # 高级：收到响应头后等待首个响应体字节的阶段超时（秒），适用于所有响应。0 = 禁用。
    # 实际等待仍不会超过剩余的总超时。
    response_body_first_byte_timeout: 30
    # 高级：响应体开始传输后，连续未收到新数据的最长时间（秒）。每次收到数据都会重新计时。0 = 禁用。
    response_body_idle_timeout: 15
    # 可选：出站代理策略。env=读取 HTTP_PROXY/HTTPS_PROXY，direct=强制直连，也可填写代理 URL。
    outbound_proxy: "env"
    # 可选：关闭此上游的日志记录，仅作为透明反代。默认 false（记录日志）。
    logging_disabled: false
    # 可选：仅记录命中规则的请求。mode 可选 all / allowlist / denylist；规则可混用 ant 和 regex。
    logging_path_filter:
      mode: allowlist
      rules:
        - matcher: ant
          pattern: "/v1/responses"
        - matcher: ant
          pattern: "/v1/chat/completions"

  gemini:
    # 匹配 gemini.localhost:8711
    target: "https://generativelanguage.googleapis.com"
    timeout: 120
    response_header_timeout: 0
    response_body_first_byte_timeout: 0
    response_body_idle_timeout: 0
    # 例如通过 Clash 本地 HTTP 代理访问 Gemini:
    # outbound_proxy: "http://127.0.0.1:7890"

  # 可选：为同一个稳定入口保存多个完整目标预设。
  # 客户端始终使用 codex.localhost:8711；只需在 UI 切换当前目标。
  # URL、超时、出站代理、参数覆盖绑定和 Usage 绑定会作为一个整体切换。
  # 切换只影响新请求，已经开始的请求会继续使用启动时的目标快照。
  codex:
    active_target: primary
    targets:
      primary:
        url: "https://api.openai.com"
        timeout: 120
        outbound_proxy: "env"
        request_overrides:
          enabled: false
          rule_names: []
        usage_extraction:
          enabled: false
          rule_names: []
      backup:
        url: "https://api.example.com"
        timeout: 120
        outbound_proxy: "direct"
        request_overrides:
          enabled: false
          rule_names: []
        usage_extraction:
          enabled: false
          rule_names: []

    # target 与 targets 是两种互斥格式；旧的单目标配置无需迁移。

# 日志配置
logging:
  # 请求内容最多保存的大小（字节）；超过后会截断，无法再加载完整内容
  max_request_body: 5242880   # 5MB
  # 响应内容最多保存的大小（字节）；超过后会截断，无法再加载完整内容
  max_response_body: 33554432 # 32MB

  # 是否在“请求体已完整发送到上游，但上游还未返回响应头”时就提前保存一次数据库快照。
  # 注意：日志详情实时查看不依赖此项；关闭时，打开中的 UI 仍可通过 live 通道看到进行中请求的 Request Body。
  # 开启后：进程重启/页面刷新/断开 live 后，仍可从数据库读取这份中间态 Request Body；
  # 代价：每个请求会额外多一次数据库写入（高并发下可能降低吞吐/更易丢日志）。
  early_request_body_snapshot: false

  # 超过此大小的完整 Body 会自动分离到 blob 存储（内容寻址 + 去重）
  detach_body_over_bytes: 2097152 # 2MB；设为 0 可禁用；留空则默认 2MB
  # 写入日志时最多保留多少可读 Body 预览；完整 Body 仍会按上方配置保存到 blob
  # 长期高频运行可适当调小；低频调试可调大，便于详情页直接预览更多内容
  body_preview_bytes: 524288      # 512KB；设为 0 可关闭预览

  # 需要脱敏的请求头
  sensitive_headers:
    - "Authorization"
    - "x-api-key"
    - "api-key"

# 模型日志路径模板。首次启动时会从程序内置的 ai_models.json 生成并写回此处。
# 初始化后可在“日志规则”页面自由新建、重命名、编辑或删除，不会因程序升级而被覆盖。
logging_rules:
  model_path_templates_initialized: false
  model_path_templates: []

# 存储配置
storage:
  # SQLite 数据库路径
  database: "./data/prismcat.db"
  # 日志保留天数；0 = 永久保留
  retention_days: 30

  # blob 存储（用于分离大 body）
  blob_store: "fs"
  blob_dir: "./data/blobs"
  
  # async_buffer controls the capacity of the async log queue.
  # Larger values allow handling higher burst throughput but use more memory.
  # Default: 4096
  # async_buffer: 4096

# 请求参数覆盖（默认关闭）
# 开启后 PrismCat 会在命中规则时修改最终发往上游的 JSON 请求体和/或请求头。
# 修改请求体会让请求从透明流式转发变为先缓冲、再转发；请只对明确需要的路由启用。
# 路径使用点号语法（如 metadata.user_id），支持的 op：set / remove / default / append / prepend。
request_overrides:
  enabled: false
  max_body_bytes: 1048576
  upstreams: {}
  rules: []
  # 示例：
  # upstreams:
  #   anthropic:
  #     enabled: true
  #     rule_names:
  #       - add metadata for claude
  # rules:
  #   - name: add metadata for claude
  #     enabled: true
  #     match:
  #       methods: ["POST"]
  #       path_prefixes: ["/v1/messages"]
  #       json:
  #         - path: "model"
  #           starts_with: "claude"
  #     patch:
  #       - op: set
  #         path: "metadata.user_id"
  #         value: "demo-user"
  #       - op: default
  #         path: "max_tokens"
  #         value: 4096
  #     headers:
  #       - op: set
  #         name: "X-Custom-Header"
  #         value: "my-value"
  #       - op: remove
  #         name: "X-Unwanted-Header"

# Usage / token 用量提取（默认关闭）
# 规则只做响应后的 best-effort 元数据提取，不影响代理转发或日志保存。
usage_extraction:
  enabled: false
  upstreams: {}
  rules:
    - name: OpenAI compatible
      enabled: true
      match:
        content_types: ["application/json", "text/event-stream"]
      paths:
        input_tokens: ["/usage/prompt_tokens", "/usage/input_tokens"]
        output_tokens: ["/usage/completion_tokens", "/usage/output_tokens"]
        total_tokens: ["/usage/total_tokens"]
        raw_usage: ["/usage"]
    - name: OpenAI Responses
      enabled: true
      match:
        content_types: ["application/json", "text/event-stream"]
      paths:
        input_tokens: ["/usage/input_tokens", "/response/usage/input_tokens"]
        output_tokens: ["/usage/output_tokens", "/response/usage/output_tokens"]
        total_tokens: ["/usage/total_tokens", "/response/usage/total_tokens"]
        raw_usage: ["/usage", "/response/usage"]
    - name: Anthropic
      enabled: true
      match:
        content_types: ["application/json", "text/event-stream"]
      paths:
        input_tokens: ["/usage/input_tokens", "/message/usage/input_tokens"]
        output_tokens: ["/usage/output_tokens", "/message/usage/output_tokens"]
        raw_usage: ["/usage", "/message/usage"]
    - name: Gemini
      enabled: true
      match:
        content_types: ["application/json", "text/event-stream"]
      paths:
        input_tokens: ["/usageMetadata/promptTokenCount"]
        output_tokens: ["/usageMetadata/candidatesTokenCount"]
        total_tokens: ["/usageMetadata/totalTokenCount"]
        raw_usage: ["/usageMetadata"]
