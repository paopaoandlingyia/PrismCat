name: Manual Binary Release (按需编译)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要补充文件的 Release 标签 (例如 v1.6.0)'
        required: true
        default: 'v1.11.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须有写入权限才能更新 Release
    
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            suffix: .exe

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 编译前端 UI
        run: |
          cd web
          npm ci
          npm run build
          # 将编译结果同步到 Go 嵌入目录
          mkdir -p ../internal/server/ui
          find ../internal/server/ui -mindepth 1 ! -name README.md -exec rm -rf {} +
          cp -r dist/* ../internal/server/ui/

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7' # 对应 go.mod 里的版本

      - name: 交叉编译二进制文件
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0 # 关键：关闭 CGO 使二进制文件在 Linux/macOS 上具备极致的便携性
        run: |
          VERSION="${{ github.event.inputs.tag_name }}"
          VERSION="${VERSION#v}"
          ASSET_NAME="prismcat-${{ github.event.inputs.tag_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          go build -ldflags="-s -w -X github.com/paopaoandlingyia/PrismCat/internal/config.Version=${VERSION}" -o "${ASSET_NAME}" ./cmd/prismcat
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: 上传到现有的 Release
        run: gh release upload "${{ github.event.inputs.tag_name }}" "${ASSET_NAME}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
